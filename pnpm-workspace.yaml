packages:
  - apps/*
  - packages/*

# Cadeia de suprimentos (ADR-0006): não instalar versões publicadas há menos de 7 dias.
minimumReleaseAge: 10080

# Só pacotes listados podem rodar scripts de instalação.
onlyBuiltDependencies:
  - '@swc/core'
  - esbuild

# esbuild antigo (GHSA-67mh-4wv8-2f99) vindo de drizzle-kit > @esbuild-kit: força versão corrigida.
overrides:
  '@esbuild-kit/core-utils>esbuild': ^0.25.0
