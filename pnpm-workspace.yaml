packages:
  - apps/*
  - packages/*

# Cadeia de suprimentos (ADR-0006): não instalar versões publicadas há menos de 7 dias.
minimumReleaseAge: 10080

# Só pacotes listados podem rodar scripts de instalação.
onlyBuiltDependencies:
  - '@swc/core'
  - esbuild

# esbuild antigo (GHSA-67mh-4wv8-2f99) vindo de drizzle-kit > @esbuild-kit: força versão corrigida.
overrides:
  '@esbuild-kit/core-utils>esbuild': ^0.25.0

# EXCEÇÃO TEMPORÁRIA (2026-10-25, revisar em 2026-10-29): as correções (body-parser 2.4.0, multer 2.5.0) saíram
# em 2026-10-22 e ainda estão dentro do prazo mínimo de 7 dias. Risco baixo: negação de serviço, API não exposta
# à internet e nenhuma rota de upload (multer não é usado). Remover assim que as versões corrigidas entrarem.
auditConfig:
  ignoreGhsas:
    - GHSA-27r3-jxmh-p828
    - GHSA-q7qp-rjg7-q26m
