packages:
  - apps/*
  - packages/*

# Cadeia de suprimentos (ADR-0006): não instalar versões publicadas há menos de 7 dias.
minimumReleaseAge: 10080

# Só pacotes listados podem rodar scripts de instalação.
onlyBuiltDependencies:
  - '@swc/core'
  - esbuild

# esbuild antigo (GHSA-67mh-4wv8-2f99) vindo de drizzle-kit > @esbuild-kit: força versão corrigida.
overrides:
  '@esbuild-kit/core-utils>esbuild': ^0.25.0
  # GHSA-27r3-jxmh-p828 (body-parser) e GHSA-q7qp-rjg7-q26m (multer): versões corrigidas, liberadas pelo prazo
  # de 7 dias em 2026-10-29. Podem sair quando express/@nestjs/platform-express já trouxerem essas versões.
  'express>body-parser': 2.4.0
  '@nestjs/platform-express>multer': 2.5.0
